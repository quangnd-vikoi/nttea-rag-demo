<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Root - Standalone Mode (MSAL)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .info {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #333; margin-bottom: 10px; }
    p { color: #666; line-height: 1.6; }
    code {
      background: #e8e8e8;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    .mode {
      display: inline-block;
      background: #2196F3;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="info">
    <span class="mode">root / index</span>
    <h1>Test Root Page</h1>
    <p>This is the root index page. Testing MSAL redirect to root URL.</p>

    <h3>Config:</h3>
    <pre>ChatBox.init({
  conciergeId: 'test-bot',
  authMode: 'standalone'
});</pre>

    <p>Widget should appear in bottom-right corner. Click "Sign in with Microsoft" to test MSAL login.</p>
  </div>

  <script src="./chatbox.js"></script>
  <script>
    ChatBox.init({
      conciergeId: 'c0003868',
      authMode: 'standalone',
      theme: 'dark'
    });
  </script>
</body>
</html>
