<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Test Standalone Mode</title>
		<style>
			body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 20px; }
			.card { background: white; padding: 20px; border-radius: 8px; max-width: 900px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
			h1 { color: #333; font-size: 1.5rem; }
			.badge { display: inline-block; background: #4caf50; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 10px; }
			p { color: #666; line-height: 1.6; }
			pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
		</style>
	</head>
	<body>
		<div class="card">
			<span class="badge">Standalone</span>
			<h1>Simplest Embed</h1>
			<p>Widget handles everything - just add 1 line:</p>

			<pre>&lt;script src="chatbox.js" data-concierge-id="YOUR_BOT_ID"&gt;&lt;/script&gt;</pre>

			<p>Click "Sign in with Microsoft" in the widget to test login.</p>
		</div>

		<!-- That's it! 1 line embed -->
		<script src="./chatbox.js" data-concierge-id="c0003726"></script>
	</body>
</html>
